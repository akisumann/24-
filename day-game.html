  const c=MOAN_CORE[lv], p=MOAN_PLEA[lv];
  let line='';
  for(let i=0;i<6;i++){ line=pickR(c)+'　'+voice(w, pickR(p)); if(line!==_lastMoan) break; }
  _lastMoan=line; return line;
}

// ---- 体格を活かした官能描写ヘルパー ----
function chichi(w){
  const b=w.body.b;
  const t=b>=125?'規格外の超乳':b>=112?'たわわに実った爆乳':b>=98?'豊かに張った巨乳':'まろやかな乳房';
  return `バスト${b}センチ、加護に育てられた垂れぬ砲弾型の${t}`;
}
function chichiAct(w){
  const b=w.body.b;
  return b>=112?`${b}センチの重たい乳房がぶるんっ、ぶるんっと大きく波打ち、桜色の乳首が宙で踊る`
       :b>=98?`${b}センチの豊かな乳がたぷんと揺れ、乳首がぷっくりと尖る`
       :`張りのある乳房がふるりと揺れる`;
}
function shiri(w){
  const h=w.body.hip;
  const t=h>=122?'たっぷりと肉のついた極上の尻':h>=108?'むっちりと張り出した豊満な尻':'丸くやわらかな尻';
  return `ヒップ${h}センチの${t}`;
}
function kubire(w){
  const d=w.body.hip-w.body.w;
  return d>=48?`ウエスト${w.body.w}センチのきゅっと絞れた細腰`:d>=38?`ウエスト${w.body.w}センチの引き締まった腰`:`ウエスト${w.body.w}センチの腰`;
}
function manko(w){
  const c=w.clit;
  const meiki=c>=22?'代を重ねて練り上げられた極上の名器':c>=14?'吸いつくような名器':'よく熟れた蜜壺';
  return `${c}mmまで育った陰核を持つ、${meiki}`;
}
function mankoAct(w){
  const c=w.clit;
  return c>=18?`奥のうねる肉ひだが${c}mmの陰核ごとオチンポ様を締めつけ、みちみちと吸い上げる`:`熱いぬめりがきゅうきゅうと絡みつく`;
}

// ---- 格差絶頂失禁 ----
function kakusaCheck(s, w, addLog){
  if(s.sens>=48){
    s.climax+=1; s.squirt=true; s.sens=clamp(s.sens+4);
    addLog(`＜格差絶頂失禁＞ 感度が高まりきり、${w.given}は突かれた拍子に「イっ……ぁあああっ♡♡」と極まって、${shiri(w)}を痙攣させながらブシュッと潮を撒き、失禁した。`);
    return true;
  }
  return false;
}

  el('vJoy').textContent=st.joy; el('bJoy').style.width=st.joy+'%';
  el('vMilk').textContent=st.milk; el('bMilk').style.width=st.milk+'%';
  el('vSubmit').textContent=st.submit; el('bSubmit').style.width=st.submit+'%';
  el('rClimax').textContent=st.climax;
  el('rSquirt').classList.toggle('hidden',!st.squirt);
}
function log(t,cls){const p=document.createElement('p');if(cls)p.className=cls;p.innerHTML=t;el('log').prepend(p);}
function startGame(w){
  W=w; st=newState(); sceneIdx=0;
  el('screen-pick').classList.add('hidden'); el('screen-play').classList.remove('hidden');
  el('wName').textContent=w.family+' '+w.given;
  el('wBadge').classList.add('hidden'); el('wBadge').textContent='';
  el('wMeta').textContent=`${w.role}・${w.age}歳／${w.tone}／B${w.body.b}・W${w.body.w}・H${w.body.hip}（陰核${w.clit}mm）`;
  el('log').innerHTML='';
  bars(); showScene();
  window.scrollTo(0,0);
}
function toPick(){el('screen-play').classList.add('hidden');el('screen-pick').classList.remove('hidden');window.scrollTo(0,0);}

function showScene(){
  const sc=SCENES[sceneIdx];
  el('scTitle').textContent=`${clockStr()}｜${sc.t}`;
  el('scNarr').textContent=sc.narr(W);
  if(sc.zana){ el('scZana').textContent='＜膣穴衆＞ '+sc.zana(W); el('scZana').classList.remove('hidden'); }
  else el('scZana').classList.add('hidden');
  el('scWho').textContent=W.family+' '+W.given;
  el('scWline').textContent=sc.wline(W);
  el('scWlineBox').classList.remove('hidden');
  el('scNudge').classList.add('hidden');
  el('scDeltas').textContent='';
  sceneStart=st.clock;
  renderChoices();
}
function renderChoices(){
  const sc=SCENES[sceneIdx];
  const box=el('scChoices'); box.innerHTML='';
  sc.choices.forEach(ch=>{
    const b=document.createElement('button'); b.className='btn'+(ch.cost?'':' primary');
    const lack=ch.need&&st.desire<ch.need;
    b.innerHTML=`<span class="k">${ch.k}</span>${ch.cost?`<span class="c">${lack?'欲が足りない':'欲 -'+ch.cost}</span>`:''}`;
    b.disabled=!!lack;
    b.onclick=()=>doAction(ch);
    box.appendChild(b);
  });
  const nx=document.createElement('button'); nx.className='btn primary'; nx.style.marginTop='6px';
  const last=sceneIdx>=SCENES.length-1;
  if(st.clock-sceneStart>=25) nx.classList.add('pulse');
  nx.innerHTML='<span class="k">'+(last?'朝を終える':'次の予定へ ▸')+'</span><span class="c" style="color:var(--muted)">+5分</span>';
  nx.onclick=()=>{ tick(); last?endMorning():(sceneIdx++,showScene(),window.scrollTo(0,0)); };
  box.appendChild(nx);
}
function applyEffects(ch){
  const before={...st};
  if(ch.cost) st.desire-=ch.cost;
  ch.fx(st);
  // 派生メーター：発情＝妻が受けた刺激（感度・悦びの伸び）で上がる／母乳の張り＝常に溜まり、乳を扱うとさらに張る
  const dS=st.sens-before.sens, dJ=st.joy-before.joy;
  st.arousal += Math.max(1, Math.round((dS+dJ)/2));
  st.milk += 4 + (/乳|授乳/.test(ch.k)?8:0);
  for(const k of ['desire','arousal','submit','sens','joy','milk']) st[k]=clamp(st[k]);
  el('scNarr').textContent=ch.res(W);
  if(ch.moan){ el('scWho').textContent=W.family+' '+W.given; el('scWline').textContent=ch.moan(W); el('scWlineBox').classList.remove('hidden'); }
  else el('scWlineBox').classList.add('hidden');
  let extra='';
  if(ch.cost) kakusaCheck(st, W, (t)=>{extra=t;});
  const diff=[]; const nm={desire:'欲',arousal:'発情',sens:'感度',joy:'悦び',milk:'母乳',submit:'従属'};
  for(const k of ['desire','arousal','sens','joy','milk','submit']){const dv=st[k]-before[k];if(dv)diff.push(`${nm[k]}${dv>0?'+':''}${dv}`);}
  if(st.climax>before.climax)diff.push('絶頂+'+(st.climax-before.climax));
  el('scDeltas').textContent=diff.join('　');
  bars();
  log('<span class="u">▸ '+ch.tag+'</span>');
  if(extra) log(extra);
  if(before.submit!==st.submit) log('夫への弱さが深まった（'+before.submit+'→'+st.submit+'）');
  checkMaxed().forEach(m=>log(m));
}
function doAction(ch){
  tick(); applyEffects(ch);
  el('scTitle').textContent=clockStr()+'｜'+SCENES[sceneIdx].t;
  const over=st.clock-sceneStart, nEl=el('scNudge');
  if(over>=25){
    let t='＜'+W.family+' '+W.given+'＞ '+nudgeLine(W);
    if(over>=45) t+='\n＜膣穴衆＞ 畏れながら——そろそろ次のお時間にございます。';
    nEl.textContent=t; nEl.classList.remove('hidden');
  }else nEl.classList.add('hidden');
  renderChoices();
}

function endMorning(){
  el('scWlineBox').classList.add('hidden'); el('scZana').classList.add('hidden'); el('scNudge').classList.add('hidden');
  el('scTitle').textContent=clockStr()+'｜朝 ─ 締め';
  el('scNarr').innerHTML=`${W.given}との朝が終わった。<br>この一日で深まった従属は、そのまま${W.given}の心と身体に残る——明日以降、${W.given}はもっと君のオチンポ様に弱くなる。`;
  el('scDeltas').textContent='';
  const box=el('scChoices'); box.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='end';
  wrap.innerHTML=`<div class="big">◇ 朝ブロック 終了 ◇</div>
    <div style="color:var(--muted);font-size:.84rem">従属 ${st.submit} ／ 発情 ${st.arousal} ／ 感度 ${st.sens} ／ 悦び ${st.joy} ／ 母乳 ${st.milk} ／ 絶頂 ${st.climax}回${st.squirt?'・潮吹き':''}</div>
    <div style="color:var(--accent);font-size:.8rem;margin-top:10px">＝ここまでがプロトタイプ。この先「日中→夕→夜→就寝」と膣妾・家中の遊びを足していく。＝</div>`;
  box.appendChild(wrap);
  const again=document.createElement('button'); again.className='btn';again.style.marginTop='12px';
  again.innerHTML='<span class="k">別の妻でもう一度</span>'; again.onclick=toPick;
  box.appendChild(again);
  bars();
}

renderPick();
</script>
</div></body></html>
