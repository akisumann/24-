function pickR(a){return a[Math.floor(Math.random()*a.length)];}

// 語尾・口調はキャラごとにそのまま（作者の癖＝地の文と淫語のテイストは全キャラ共通、語尾だけ個別）
function voice(w, base){
  const t=w.tone||'';
  if(/古風|古めかし/.test(t)) return base.replace(/です|ます/g,'じゃ').replace(/わたくし|わたし|私/g,'わらわ').replace(/ませ/g,'や').replace(/ください/g,'たも');
  if(/甘え|甘い|舌足らず/.test(t)) return base.replace(/ください/g,'くだちゃい').replace(/。$/,'ぅ…♡').replace(/…$/,'ぅ…♡');
  if(/元気|活発|明る/.test(t)) return base.replace(/です♡/g,'ですっ♡').replace(/。$/,'っ♡');
  return base; // 丁寧・クールは素通し（クールは tsun() で強がり付与）
}
// 強がりキャラ（クール系）専用：媚びの頭に反発、語尾に💢を混ぜる（強がり↔陥落を一文で両立）
function tsun(w, base){
  if(!/クール|無口|寡黙|冷/.test(w.tone||'')) return base;
  const head=pickR(['べっ、別に……♡💢 ','ちがっ、勘違いしないでっ♡💢 ','っ……認めませんからねっ♡💢 ','だ、誰があなたなんかにっ♡💢 ']);
  // 末尾の♡群のあとに💢を一つだけ足す（強がり↔陥落）
  return head+base.replace(/(♡+)(?![sS]*♡)/, '$1💢');
}

function moan(w, lv){
  const c=MOAN_CORE[lv], p=MOAN_PLEA[lv];
  let line='';
  for(let i=0;i<8;i++){ const raw=pickR(p)(w); line=pickR(c)+'　'+tsun(w, voice(w, raw)); if(line!==_lastMoan) break; }
  _lastMoan=line; return line;
}

function chichi(w){
  const b=w.body.b;
  const t=b>=125?'規格外の超乳':b>=112?'たわわに実った爆乳':b>=98?'豊かに張った巨乳':'まろやかな乳房';
  return `バスト${b}センチ、加護に育てられた垂れぬ砲弾型の${t}`;
}
function chichiAct(w){
  const b=w.body.b;
  return b>=112?`${b}センチの重たい乳房がぶるんっ、ぶるんっと大きく波打ち、桜色の乳首が宙で踊る`
       :b>=98?`${b}センチの豊かな乳がたぷんと揺れ、乳首がぷっくりと尖る`
       :`張りのある乳房がふるりと揺れる`;
}
function shiri(w){
  const h=w.body.hip;
  const t=h>=122?'たっぷりと肉のついた極上の尻':h>=108?'むっちりと張り出した豊満な尻':'丸くやわらかな尻';
  return `ヒップ${h}センチの${t}`;
}
function kubire(w){
  const d=w.body.hip-w.body.w;

}

      {k:'淫紋をなぞりながら授乳させる',cost:10,dmg:12,ecchi:15,res:(w)=>`${w.given}を膝に抱え、下腹の淫紋をなぞりながら乳を含む。当たるたび母乳がとろっと溢れ、${w.given}は甘い声で喘ぎ続ける。`,moan:(w)=>moan(w,2)}
    ]
  }
 }
];

// カテゴリごとに夫の欲の増減を割り当てる。前戯（見る/イタズラ/その他）は欲を"溜め"、挿入だけが欲を"使う"。
SCENES.forEach(sc=>{
  Object.keys(sc.menu).forEach(cat=>{
    sc.menu[cat].forEach(mv=>{
      mv._cat=cat;
      if(cat==='挿入'){ /* mv.cost をそのまま消費に使う */ }
      else { mv.gain=(cat==='見る')?20:12; delete mv.cost; }
    });
  });
});

// ---- 状態 ----
let W=null, sceneIdx=0;
let day=null;      // {desire, ecchi, climax, squirt, milk, clock}
let scene=null;     // {hp, hpMax}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function newDay(){return {desire:35,ecchi:20,climax:0,squirt:false,milk:false,clock:360,maxed:{ecchi:false}};}
function newScene(){const sc=SCENES[sceneIdx];return {hp:sc.hpMax,hpMax:sc.hpMax};}
function clockStr(){const c=day.clock%1440,h=Math.floor(c/60),m=c%60,p=h<11?'朝':h<17?'昼':h<19?'夕':'夜';return p+' '+h+':'+String(m).padStart(2,'0');}
function tick(n){day.clock+=(n||5);}

function el(id){return document.getElementById(id);}
function renderPick(){
  const g=el('pickGrid'); g.innerHTML='';
  WIVES.forEach(w=>{
    const d=document.createElement('button'); d.className='wife';
    d.innerHTML=`<div class="nm">${w.family} ${w.given}</div>
      <div class="rl">${w.role}・${w.age}歳<span class="pill">${w.tone}</span></div>
      <div class="tg">${w.tag||''}</div>
      <div class="bd">B${w.body.b}/W${w.body.w}/H${w.body.hip}・陰核${w.clit}mm</div>`;
    d.onclick=()=>startGame(w);
    g.appendChild(d);
  });
}
function log(t,cls){const p=document.createElement('p');if(cls)p.className=cls;p.innerHTML=t;el('log').prepend(p);}

// ---- ゲージ描画（ゆっくりアニメーション：数値カウントとバー幅を一緒に補間） ----
let numTweens={};
function tweenNumber(elId,from,to,ms){
  if(numTweens[elId])cancelAnimationFrame(numTweens[elId]);
  const t0=performance.now();
  const node=el(elId);
  function step(t){
    const p=Math.min(1,(t-t0)/ms);
    const cur=Math.round(from+(to-from)*p);
    node.textContent=cur;
    node.classList.toggle('neg',cur<0);
    if(p<1)numTweens[elId]=requestAnimationFrame(step);
  }
  numTweens[elId]=requestAnimationFrame(step);
}
let prevShown={hp:null,ecchi:null,mp:null};
function renderGauges(){
  const hpPct=clamp(scene.hp/scene.hpMax*100,0,100);
  const overPct=scene.hp<0?clamp(-scene.hp/scene.hpMax*100,0,100):0;
  const hpFill=el('bHp');
  hpFill.style.width=hpPct+'%';
  hpFill.classList.remove('mid','low');
  if(hpPct<60&&hpPct>=25)hpFill.classList.add('mid'); else if(hpPct<25)hpFill.classList.add('low');
  el('bHpOver').style.width=overPct+'%';
  el('bEcchi').style.width=clamp(day.ecchi,0,100)+'%';
  el('bMp').style.width=clamp(day.desire,0,100)+'%';
  tweenNumber('vHp', prevShown.hp==null?scene.hp:prevShown.hp, scene.hp, 900);
  tweenNumber('vEcchi', prevShown.ecchi==null?day.ecchi:prevShown.ecchi, day.ecchi, 900);
  tweenNumber('vMp', prevShown.mp==null?day.desire:prevShown.mp, day.desire, 900);
  prevShown={hp:scene.hp,ecchi:day.ecchi,mp:day.desire};
}

function startGame(w){
  W=w; day=newDay(); sceneIdx=0; scene=newScene();
  prevShown={hp:null,ecchi:null,mp:null};
  el('screen-pick').classList.add('hidden'); el('screen-battle').classList.remove('hidden');
  el('wName').textContent=w.family+' '+w.given;
  el('wBadge').classList.add('hidden'); el('wBadge').textContent='';
  el('log').innerHTML='';
  showScene(true);
  window.scrollTo(0,0);
}
function toPick(){el('screen-battle').classList.add('hidden');el('screen-pick').classList.remove('hidden');window.scrollTo(0,0);}

function showScene(fresh){
  const sc=SCENES[sceneIdx];
  if(fresh){ scene=newScene(); }
  el('scClock').textContent=clockStr();
  el('scTitle').textContent=sc.t;
  el('scNarr').textContent=sc.narr(W);
  el('scSfx').classList.add('hidden');
  el('scWho').textContent=W.family+' '+W.given;
  el('scWline').textContent=tsun(W, sc.wline(W));
  el('scWlineBox').classList.remove('hidden');
  renderGauges();
  renderTopMenu();
}
function renderTopMenu(){
  const area=el('cmdArea'); area.innerHTML='';
  const grid=document.createElement('div'); grid.className='cmdgrid';
  ['見る','イタズラ','挿入','その他'].forEach(key=>{
    const b=document.createElement('button'); b.className='cmd'; b.textContent=key;
    b.onclick=()=>renderSubmenu(key);
    grid.appendChild(b);
  });
  area.appendChild(grid);
}
function renderSubmenu(key){
  const sc=SCENES[sceneIdx];
  const moves=sc.menu[key];
  const area=el('cmdArea'); area.innerHTML='';
  const list=document.createElement('div'); list.className='sublist';
  moves.forEach(mv=>{
    const b=document.createElement('button'); b.className='subbtn';
    const lack=mv.cost&&day.desire<mv.cost;
    const tag=mv.cost?`<span class="c">${lack?'欲が足りない':'欲 -'+mv.cost}</span>`:(mv.gain?`<span class="c" style="color:var(--gold)">欲 +${mv.gain}</span>`:'');
    b.innerHTML=`<span class="k">${mv.k}</span>${tag}`;
    b.disabled=!!lack;
    b.onclick=()=>runMove(mv);
    list.appendChild(b);
  });
  area.appendChild(list);
  const row=document.createElement('div'); row.className='backrow';
  const back=document.createElement('button'); back.className='backbtn'; back.textContent='◀ 戻る';
  back.onclick=renderTopMenu;
  row.appendChild(back); area.appendChild(row);
}

function runMove(mv){
  tick();
  if(mv.cost) day.desire=clamp(day.desire-mv.cost,0,100);
  if(mv.gain) day.desire=clamp(day.desire+mv.gain,0,100);
  scene.hp -= mv.dmg;
  day.ecchi=clamp(day.ecchi+mv.ecchi,0,999);
  if(mv.climax) day.climax+=mv.climax;
  el('scClock').textContent=clockStr();
  el('scNarr').textContent=mv.res(W);
  const sfxLine=mv.sfx||pickR(SFX[mv._cat]||['']);
  if(sfxLine){ el('scSfx').textContent=sfxLine; el('scSfx').classList.remove('hidden'); } else el('scSfx').classList.add('hidden');
  el('scWho').textContent=W.family+' '+W.given;
  el('scWline').textContent=mv.moan(W);
  el('scWlineBox').classList.remove('hidden');
  log('<span class="u">▸ '+mv.k+'</span>');

  // エッチ度100到達＝波の絶頂（場面は続く。50へ戻り、余裕も少し削れる）
  if(day.ecchi>=100){
    day.ecchi=50; day.climax+=1; day.squirt=true; scene.hp-=6;
    log('<span class="u">＜エッチ絶頂＞</span> 高まりきったエッチ度が弾け、'+W.given+'は「イ、イくぅっ♡♡ お゛っ♡」と一つ大きく達した。ブシュッと軽く漏らして、また次の波へ溜まりはじめる。');
  }
  renderGauges();

  // 余裕が尽きた（マイナスに落ちた）＝この場面の決着＝格差絶頂失禁
  if(scene.hp<0){
    day.squirt=true;
    const last=sceneIdx>=SCENES.length-1;
    log('<span class="cl">■ 格差絶頂失禁</span> '+W.given+'の余裕が尽きた。');
    el('scWlineBox').classList.add('hidden');
    el('scSfx').textContent='『ぷっしゃぁあああ～～っ♡♡♡ ぷしっ♡ ぷしっ♡ ぷしゃっ♡』';
    el('scSfx').classList.remove('hidden');
    el('scNarr').innerHTML='<span class="clear">'+W.given+'は「イ、イっ……お゛っ♡ ほお゛ぉ～～っ♡♡♡」と大きくのけ反り、格の差だけで潮を撒き散らして格差絶頂失禁した。膝から崩れ落ち、痙攣しながら「あなたの、勝ちですっ……♡」と繰り返す。</span>';
    const area=el('cmdArea'); area.innerHTML='';
    const btn=document.createElement('button'); btn.className='cmd'; btn.style.width='100%';
    btn.textContent=last?'朝を終える':'次の場面へ ▸';
    btn.onclick=()=> last?endMorning():(sceneIdx++,showScene(true),window.scrollTo(0,0));
    area.appendChild(btn);
    return;
  }
  renderTopMenu();
}

function endMorning(){
  el('scWlineBox').classList.add('hidden');
  el('scSfx').classList.add('hidden');
  el('scTitle').textContent='朝 ─ 締め ／ 種付け';
  el('scNarr').innerHTML=`何度も余裕を失い、格の差で潮を撒き散らした${W.given}を、最後に組み敷く。「孕ませてくださいっ♡♡ あなた専用の孕み袋ですっ♡♡」——溜めきった欲を、一番深いところへ解き放つ。`
    +`<div class="cumshot">${CUMSHOT}</div>`
    +`<span class="clear">${W.given}の子宮に、優秀な種がたっぷりと注ぎ込まれた。この体は明日以降、もっと君のオチンポ様に弱くなっているはずだ。</span>`;
  const area=el('cmdArea'); area.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='end';
  wrap.innerHTML=`<div class="big">◇ 朝ブロック 終了 ◇</div>
    <div style="color:var(--muted);font-size:.84rem">絶頂 ${day.climax}回${day.squirt?'・潮吹き失禁':''} ／ エッチ度 ${day.ecchi}</div>
    <div style="color:var(--accent);font-size:.8rem;margin-top:10px">＝ここまでがプロトタイプ。この先「日中→夕→夜→就寝」を足していく。＝</div>`;
  area.appendChild(wrap);
  const again=document.createElement('button'); again.className='cmd';again.style.marginTop='10px';again.style.width='100%';
  again.textContent='別の妻でもう一度'; again.onclick=toPick;
  area.appendChild(again);
}

renderPick();
</script>
