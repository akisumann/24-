name: Game check

# 本物のゲームコードをヘッドレスで走らせ、エラーなく動くこと・決まりを守ること・
# 決まった seed の結果が基準値（tests/golden.json）から変わっていないことを確かめる。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run game check
        run: node tests/game-check.js
